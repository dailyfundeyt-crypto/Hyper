[project]
name = "hyper"
version = "0.1.0"
description = "Paper-only early-warning confluence MCP"
requires-python = ">=3.11"
dependencies = ["ccxt>=4.4.0,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["server", "adapters", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I"]
