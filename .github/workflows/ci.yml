name: ci

on:
  pull_request:
  push:
    branches: [main, "a/platform", "b/signal"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Lint
        run: ruff check server adapters tests scripts
      - name: Unit tests
        run: python -m pytest -q
      - name: Reject committed secrets
        run: python scripts/check_secrets.py
